<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="main.js" defer></script>
</head>

<body>
    <h1 style="position:absolute; top:20%; left:50%; transform: translate(-50%,-50%); color: #fbf4e6;">Test URLs</h1>
    <div id="url_box"><input class="form-control" id="url_input" onEnter="submitUrl()"><button type="button" style="width:70px"
            class="btn btn-primary" onclick="submitUrl()">Check</button></div>
    <table class="table resultTable hidden" id="resultTable">
        <tr id="format">
            <td>Format</td>
            <td>
                <div>-</div>
            </td>
        </tr>
        <tr id="encoding">
            <td>Encoding</td>
            <td>
                <div>-</div>
            </td>
        </tr>
        <tr id="dns">
            <td>DNS</td>
            <td>
                <div>-</div>
            </td>
        </tr>
        <tr id="availability">
            <td>Availability</td>
            <td>
                <div>-</div>
            </td>
        </tr>
        <tr id="security">
            <td>Security (SSL)</td>
            <td>
                <div>-</div>
            </td>
        </tr>
    </table>
    <div class="successDiv hidden">
        <div style="font-size: 30px;width: 100%;justify-content: center;display: flex;">All tests Passed!</div>
        <div style="
            font-size: smaller;
            padding: 5px 20px;
            text-align: center;
        ">We can only check for internet protocols. Beware of fraud, viruses and data theft!</div>
    </div>
</body>

</html>
